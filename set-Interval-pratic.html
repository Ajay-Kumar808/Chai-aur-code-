<body>

    <script>

        // const demo = function(){

        const p = document.querySelector('p')
        console.log(p)
        const demo = function(){
            p.innerText = "hi ajay"
            console.log("hi")
        }
      const stopTextChange = setInterval(demo, 2000)

      const stops = document.querySelector('#stop')
      stops.addEventListener('click',function(){
        clearInterval(stopTextChange)
      })


    </script>
